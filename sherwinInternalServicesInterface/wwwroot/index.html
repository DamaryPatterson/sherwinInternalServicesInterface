<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sherwin-Williams Jamaica - POS Portal</title>
    <!-- Google Fonts Link -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    <!-- External CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- BACKGROUND: The Active Animation Canvas -->
    <div class="animated-bg">
        <div class="logo-stage">
            <div class="icon-container">
                <!-- Vector Paint Can -->
                <svg class="paint-can" viewBox="0 0 100 100">
                    <rect x="25" y="20" width="50" height="60" rx="5" class="can-body" 
                          stroke="#0168B3" stroke-width="6" />

                    <line x1="25" y1="35" x2="75" y2="35" stroke="#0168B3" stroke-width="4" />

                    <text x="50" y="62" font-family="Arial, sans-serif" font-weight="bold" 
                          font-size="18" fill="#EF4135" text-anchor="middle" transform="rotate(-90 50 58)">SWP</text>
                </svg>

                <!-- Pouring Paint Stream -->
                <div class="paint-stream"></div>

                <!-- Vector Globe Base -->
                <svg class="globe-container" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" fill="#0168B3" />
                    <path d="M 8,40 Q 50,20 92,40 A 45 45 0 0 0 8 40 Z" fill="#EF4135" />
                    <path d="M 8,40 Q 30,65 50,45 Q 70,25 92,40 A 45 45 0 0 1 8 40 Z" fill="#EF4135" />
                    <circle cx="20" cy="88" r="4" fill="#EF4135" />
                    <circle cx="50" cy="94" r="5" fill="#EF4135" />
                    <circle cx="80" cy="86" r="4" fill="#EF4135" />
                    <text x="50" y="42" font-family="Arial, sans-serif" font-weight="900" font-size="7" fill="#FFFFFF" text-anchor="middle">COVER</text>
                    <text x="50" y="50" font-family="Arial, sans-serif" font-weight="900" font-size="7" fill="#FFFFFF" text-anchor="middle">THE</text>
                    <text x="50" y="58" font-family="Arial, sans-serif" font-weight="900" font-size="7" fill="#FFFFFF" text-anchor="middle">EARTH</text>
                </svg>
            </div>

            <!-- Typography Container -->
            <div class="text-container">
                <div class="brand-text">SHERWIN-WILLIAMS</div>
            </div>
        </div>
    </div>

    <!-- FOREGROUND: User Interface Layer -->
    <div class="portal-content-wrapper">

        <header class="header">
            <div class="logo-container">
                <div class="logo">
                    <img id="brandLogo" src="/Sherwin-Williams-logo.png" alt="Sherwin-Williams Logo">
                </div>
            </div>
            <div class="header-right">
                <button id="themeToggle" class="theme-btn" aria-label="Toggle Theme">
                    <span class="mode-icon">🌙</span>
                </button>
                <div class="portal-title">Employee Portal</div>
            </div>
        </header>

        <nav class="nav-ribbon">
            <button class="ribbon-item" onclick="
                openModal('https://forms.office.com/r/AhGTH49s9N')">
                <span class="ribbon-icon">👤</span> Employee POS Addition
            </button>
            <button class="ribbon-item" onclick="
                openModal('https://forms.office.com/r/pKucamEjyR')">
                <span class="ribbon-icon">🔄</span> Employee Billing code Transfer
            </button>
            <button class="ribbon-item" onclick="
                openModal('https://your-deletion-form-link')">
                <span class="ribbon-icon">🗑️</span> Employee POS Removal
            </button>
            <button class="ribbon-item" onclick="
                openModal('https://your-deletion-form-link')">
                <span class="ribbon-icon">^^</span> Employee Elevation Request
            </button>
        </nav>

        <section class="hero">
            <h1>Welcome to POS Services</h1>
            <p>Select an operation from the top menu ribbon to load the digital request form.</p>
        </section>

        <!-- Modal Window -->
        <div class="modal" id="modal">
            <div class="modal-content">
                <span class="close-btn" onclick="closeModal()">✖</span>
                <iframe id="formFrame" src=""></iframe>
            </div>
        </div>

        <footer class="footer">© 2026 Sherwin-Williams Jamaica MCBA-POS</footer>
    </div>

    <!-- External JS -->
    <script src="script.js"></script>
</body>
</html>
